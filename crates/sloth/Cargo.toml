[package]
name = "sloth"
version = "0.1.0"
edition = "2021"
description = "Local-only commit messages and release changelogs"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
llama-cpp-2 = { version = "0.1.160", features = ["common"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
